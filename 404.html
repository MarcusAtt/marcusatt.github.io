<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D97706">
  <title>Page Not Found | Marcus Attallah</title>
  <link rel="icon" href="/favicon.svg?v=orange-20261026" type="image/svg+xml">
  <style>
    :root{color-scheme:light;--ink:#0F172A;--slate:#475569;--orange:#D97706;--paper:#F8FAFC}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:1.5rem}
    main{width:min(680px,100%);text-align:center;background:#fff;border:1px solid #E2E8F0;border-radius:1.5rem;padding:clamp(2rem,7vw,5rem);box-shadow:0 20px 45px rgba(15,23,42,.08)}
    .mark{display:inline-grid;place-items:center;width:4rem;height:4rem;border-radius:1rem;background:var(--orange);color:#fff;font-weight:900;font-size:1.5rem;margin-bottom:1.5rem}
    h1{font-size:clamp(2.25rem,7vw,4.5rem);line-height:1;margin:0 0 1rem;font-weight:900;letter-spacing:-.04em}
    p{color:var(--slate);font-size:1.1rem;line-height:1.7;margin:0 auto 2rem;max-width:34rem}
    a{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:.85rem 1.4rem}
    a:hover{background:#B45309}
    a:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">MA</div>
    <h1>Page not found.</h1>
    <p>The page you’re looking for may have moved, but the portfolio is still here.</p>
    <a href="/">Return to portfolio →</a>
  </main>
</body>
</html>
